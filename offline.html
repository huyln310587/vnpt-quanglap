<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VNPT địa bàn Quảng Lập - Mất kết nối</title>
  <meta name="theme-color" content="#005baa">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eaf6ff, #ffffff);
      color: #0b2545;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      background: #fff;
      border: 1px solid #d9e6f2;
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 16px 40px rgba(0, 69, 124, 0.12);
    }
    h1 { margin: 0 0 12px; }
    p { color: #667085; line-height: 1.6; }
    a {
      display: inline-flex;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #005baa;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Đang mất kết nối Internet</h1>
    <p>Không thể tải nội dung mới. Vui lòng kiểm tra kết nối mạng rồi mở lại ứng dụng VNPT địa bàn Quảng Lập.</p>
    <a href="/">Thử lại</a>
  </div>
</body>
</html>
